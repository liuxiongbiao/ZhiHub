# .github/workflows/ci.yml
# 职责: 企业级 CI 门禁 —— 全新安装 / 语法 / 单测+契约+覆盖率 / 安全审计 / 迁移一致性

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
      rabbitmq:
        image: rabbitmq:3.12-management
        ports: ["5672:5672"]
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: zhihub
          MYSQL_USER: zhihub
          MYSQL_PASSWORD: zhihub
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h localhost -uroot -proot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Syntax check (compileall)
        run: |
          cd backend
          python -m compileall app/ scripts/ tests/ -q

      - name: Dependency security audit (pip-audit)
        run: |
          cd backend
          pip-audit -r requirements.txt -f json -o audit.json || true
          python scripts/ci_audit_gate.py audit.json --ignore-file scripts/audit_ignore.json

      - name: Migration consistency (alembic upgrade + check)
        run: |
          cd backend
          alembic upgrade head
          alembic check
        env:
          APP_ENV: test
          APP_SECRET_KEY: ci-only-secret-key
          MYSQL_HOST: localhost
          MYSQL_PORT: "3306"
          MYSQL_USER: zhihub
          MYSQL_PASSWORD: zhihub
          MYSQL_DATABASE: zhihub

      - name: Run unit + contract tests with coverage
        run: |
          cd backend
          python -m pytest tests/unit tests/contracts -q --tb=short \
            --cov=app --cov-report=term-missing
        env:
          APP_ENV: test
          APP_SECRET_KEY: ci-only-secret-key
          REDIS_HOST: localhost
          MYSQL_HOST: localhost
          RABBITMQ_URL: amqp://guest:guest@localhost:5672/
          ALIPAY_APP_ID: ""
          WECHAT_APP_ID: ""
          OCR_API_KEY: ""

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Dependency security audit (npm audit)
        run: |
          cd frontend
          npm audit --audit-level=high

      - name: Type check (vue-tsc)
        run: |
          cd frontend
          npx vue-tsc --noEmit

      - name: Run unit/component tests
        run: |
          cd frontend
          npx vitest run

      - name: Production build
        run: |
          cd frontend
          npm run build
