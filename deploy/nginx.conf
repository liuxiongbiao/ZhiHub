# deploy/nginx.conf
# 职责: Nginx 反向代理 —— 前端 SPA 静态文件 + /api 反代到 backend + WebSocket 升级

server {
    listen 80;
    server_name localhost;
    # 变量形式 proxy_pass：按请求时解析 backend（容器重建 IP 变化后无需重启 nginx）
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream http://backend:8000;
    set $frontend_upstream http://frontend;

    # 坐席工作台 WebSocket（必须在 /api/ 之前匹配，nginx 按最长前缀命中）
    location /api/v1/ws/ {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # P0-2: 传递真实 scheme（http/https），后端推导 Widget WebSocket 地址用
        proxy_set_header X-Forwarded-Proto $scheme;
        # 覆盖而非追加，防止客户端伪造 X-Forwarded-For
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 3600s;
    }

    # API 反代到 backend 服务（Docker 内部网络）
    location /api/ {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # P0-2: 传递真实 scheme（http/https），后端推导 Widget WebSocket 地址用
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 120s;
    }

    # 健康检查透传
    location /health {
        proxy_pass $backend_upstream;
    }

    # 前端 SPA（Vue Router history mode fallback）
    location / {
        proxy_pass $frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # P0-2: 传递真实 scheme（http/https），后端推导 Widget WebSocket 地址用
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
