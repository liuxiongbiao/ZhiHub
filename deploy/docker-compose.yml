# deploy/docker-compose.yml
# 职责: 七个中间件容器编排（mysql/mongo/redis/rabbitmq/milvus/es）+ 前后端服务
# 分工: 🟡 弱模型写初版，强模型排版本兼容/网络配置坑
# 对应日程: Day 1（起中间件）→ Day 9（补前后端服务+Nginx，完整定稿）
#
# 内存预算（16GB物理内存机器实测参考，mem_limit 为硬上限，容器超限会被OOM kill）：
#   mysql ~512MB / mongo ~512MB / redis ~256MB / rabbitmq ~512MB
#   elasticsearch ~1.5GB（ES_JAVA_OPTS 强制限制堆，否则会吃满可用内存）
#   milvus ~2GB / etcd ~256MB / minio ~512MB（milvus standalone 的两个隐藏依赖，缺了起不来）
#   合计约 6GB 容器占用 + Docker Desktop/WSL2自身开销，16GB机器留有余量。
#
# Windows 前置: Docker Desktop 必须启用 WSL2 backend，Settings->Resources->Memory 建议给到 10-12GB。

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: zhihub
      MYSQL_USER: zhihub
      MYSQL_PASSWORD: zhihub
    ports: ["3307:3306"]  # 本机3306被已安装的MySQL服务占用，容器内部仍是3306，宿主机侧改用3307
    mem_limit: 512m
    volumes:
      - mysql_data:/var/lib/mysql

  mongo:
    image: mongo:7.0
    ports: ["27017:27017"]
    mem_limit: 512m
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    mem_limit: 256m

  rabbitmq:
    image: rabbitmq:3.12-management
    ports: ["5672:5672", "15672:15672"]
    mem_limit: 512m

  elasticsearch:
    image: elasticsearch:8.13.0  # docker.elastic.co国内不可达且daocloud代理不支持该源(403)，改用Elastic官方在Docker Hub发布的同版本镜像
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      # 强制限制JVM堆，不加这个ES默认会吃掉一半可用内存，16GB机器上极易把预算打爆
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
    ports: ["9200:9200"]
    mem_limit: 1.5g
    volumes:
      - es_data:/usr/share/elasticsearch/data

  # ---- Milvus standalone 的两个隐藏依赖，缺了 milvus 容器会直接崩溃退出 ----
  etcd:
    image: quay.nju.edu.cn/coreos/etcd:v3.5.5  # daocloud代理对quay.io限流不稳定，改用南京大学quay.io镜像站
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    mem_limit: 256m
    volumes:
      - etcd_data:/etcd

  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    command: minio server /minio_data
    mem_limit: 512m
    volumes:
      - minio_data:/minio_data

  milvus:
    image: milvusdb/milvus:v2.4.0
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    ports: ["19530:19530", "9091:9091"]
    mem_limit: 2g
    depends_on:
      - etcd
      - minio
    volumes:
      - milvus_data:/var/lib/milvus

  # ─── 008: Langfuse 自托管可观测（langfuse + postgres + clickhouse）───
  langfuse-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: langfuse
      POSTGRES_DB: langfuse
    mem_limit: 256m
    volumes:
      - langfuse_db_data:/var/lib/postgresql/data

  clickhouse:
    image: clickhouse/clickhouse-server:24.1
    environment:
      CLICKHOUSE_DB: langfuse
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: clickhouse
    mem_limit: 512m
    volumes:
      - clickhouse_data:/var/lib/clickhouse

  langfuse:
    image: langfuse/langfuse:3
    environment:
      DATABASE_URL: postgresql://langfuse:langfuse@langfuse-db:5432/langfuse
      CLICKHOUSE_URL: clickhouse://clickhouse:8123/langfuse
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: clickhouse
      NEXTAUTH_SECRET: langfuse-demo-secret-2026
      SALT: langfuse-demo-salt-2026
      NEXTAUTH_URL: http://localhost:3000
      TELEMETRY_ENABLED: "false"
    ports: ["3000:3000"]
    mem_limit: 512m
    depends_on:
      - langfuse-db
      - clickhouse

  # ─── Day 9: 前后端 + Nginx ───
  backend:
    build: ../backend
    ports: ["8000:8000"]
    environment:
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - REDIS_HOST=redis
      - MONGO_URI=mongodb://mongo:27017/zhihub
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
      - MILVUS_HOST=milvus
      - ELASTICSEARCH_URL=http://elasticsearch:9200
    depends_on:
      - mysql
      - redis
      - mongo
      - rabbitmq

  frontend:
    build: ../frontend
    ports: ["5173:80"]

  nginx:
    image: nginx:alpine
    ports: ["80:80"]
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend

volumes:
  mysql_data:
  mongo_data:
  es_data:
  etcd_data:
  minio_data:
  milvus_data:
  langfuse_db_data:
  clickhouse_data:
