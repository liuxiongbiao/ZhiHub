# deploy/docker-compose.yml
# 职责: 中间件 + 前后端 + Nginx 编排（企业级基线：迁移自动执行、健康检查、凭据注入、端口收敛）
# 凭据策略: 全部通过环境变量注入（见同目录 .env.example）；生产必须显式覆盖，禁止沿用默认值。
# 使用: cp .env.example .env && docker compose up -d --build

x-backend-env: &backend-env
  APP_ENV: ${APP_ENV:?APP_ENV must be set in deploy/.env (see .env.example)}
  APP_SECRET_KEY: ${APP_SECRET_KEY:-change-me}
  JWT_REFRESH_TOKEN_EXPIRE_DAYS: ${JWT_REFRESH_TOKEN_EXPIRE_DAYS:-30}
  DEV_ALLOW_CODE_REVEAL: ${DEV_ALLOW_CODE_REVEAL:-false}
  MYSQL_HOST: ${MYSQL_HOST:-mysql}
  MYSQL_PORT: ${MYSQL_PORT:-3306}
  MYSQL_USER: ${MYSQL_USER:-zhihub}
  MYSQL_PASSWORD: ${MYSQL_PASSWORD:-zhihub}
  MYSQL_DATABASE: ${MYSQL_DATABASE:-zhihub}
  REDIS_HOST: ${REDIS_HOST:-redis}
  REDIS_PASSWORD: ${REDIS_PASSWORD:-zhihub-dev}
  MONGO_URI: ${MONGO_URI:-mongodb://mongo:27017/zhihub}
  RABBITMQ_URL: amqp://${RABBITMQ_USER:-zhihub}:${RABBITMQ_PASS:-zhihub-dev}@rabbitmq:5672/
  MILVUS_HOST: ${MILVUS_HOST:-milvus}
  ELASTICSEARCH_URL: ${ELASTICSEARCH_URL:-http://elasticsearch:9200}
  DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
  EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
  LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
  LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
  LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL:-http://langfuse:3000}
  ALIPAY_APP_ID: ${ALIPAY_APP_ID:-}
  ALIPAY_APP_PRIVATE_KEY: ${ALIPAY_APP_PRIVATE_KEY:-}
  ALIPAY_PUBLIC_KEY: ${ALIPAY_PUBLIC_KEY:-}
  WECHAT_APP_ID: ${WECHAT_APP_ID:-}
  WECHAT_APP_SECRET: ${WECHAT_APP_SECRET:-}
  OCR_API_KEY: ${OCR_API_KEY:-}
  OCR_SECRET_KEY: ${OCR_SECRET_KEY:-}
  BILLING_CHARGE_TRIAL: ${BILLING_CHARGE_TRIAL:-true}
  BILLING_OVERAGE_PRICE: ${BILLING_OVERAGE_PRICE:-0.5}
  BILLING_PLAN_BASE_FEES: ${BILLING_PLAN_BASE_FEES:?BILLING_PLAN_BASE_FEES must be set in deploy/.env (see .env.example)}
  UPLOAD_MAX_FILE_SIZE_MB: ${UPLOAD_MAX_FILE_SIZE_MB:-10}
  UPLOAD_STORAGE_DIR: ${UPLOAD_STORAGE_DIR:-/data/uploads}
  WS_PUBSUB_CHANNEL: ${WS_PUBSUB_CHANNEL:-zhihub:ws:broadcast}
  PAYMENT_ENABLED: ${PAYMENT_ENABLED:-false}
  SMS_ENABLED: ${SMS_ENABLED:-false}
  WECHAT_ENABLED: ${WECHAT_ENABLED:-false}
  EMAIL_ENABLED: ${EMAIL_ENABLED:-false}
  LLM_ENABLED: ${LLM_ENABLED:-false}
  EMBEDDING_ENABLED: ${EMBEDDING_ENABLED:-false}
  PLATFORM_OPS_TOKEN: ${PLATFORM_OPS_TOKEN:-}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_FROM: ${SMTP_FROM:-}
  EMAIL_VERIFY_REQUIRED: ${EMAIL_VERIFY_REQUIRED:-true}
  EMAIL_VERIFY_LINK_BASE: ${EMAIL_VERIFY_LINK_BASE:-http://localhost:5173}
  INVITE_LINK_BASE: ${INVITE_LINK_BASE:-http://localhost:5173/accept-invite}
  RAGFLOW_BASE_URL: ${RAGFLOW_BASE_URL:-}
  RAGFLOW_API_KEY: ${RAGFLOW_API_KEY:-}
  RAGFLOW_EMAIL: ${RAGFLOW_EMAIL:-}
  RAGFLOW_PASSWORD: ${RAGFLOW_PASSWORD:-}
  RAGFLOW_DATASET_ID: ${RAGFLOW_DATASET_ID:-}
  RAGFLOW_PARSE_TIMEOUT_SECONDS: ${RAGFLOW_PARSE_TIMEOUT_SECONDS:-300}
  # P0-2: Widget 嵌入代码公共基地址（生产必须显式配置为对外 https 域名；
  # 为空时 development 环境回退 http://localhost:5173，production 生成嵌入代码接口报 409）
  PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}

services:
  mysql:
    image: mysql:8.0
    command: ["mysqld", "--log-bin-trust-function-creators=1"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-zhihub}
      MYSQL_USER: ${MYSQL_USER:-zhihub}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-zhihub}
    ports: ["127.0.0.1:3307:3306"]
    mem_limit: 512m
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - mysql_data:/var/lib/mysql

  mongo:
    image: mongo:7.0
    ports: ["127.0.0.1:27017:27017"]
    mem_limit: 512m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-zhihub-dev}
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-zhihub-dev}"]
    ports: ["127.0.0.1:6379:6379"]
    mem_limit: 256m
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.12-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-zhihub}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-zhihub-dev}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    mem_limit: 512m
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 15s
      timeout: 10s
      retries: 10

  elasticsearch:
    image: elasticsearch:8.13.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - path.repo=/usr/share/elasticsearch/snapshots
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
    ports: ["127.0.0.1:9200:9200"]
    mem_limit: 1536m
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
    volumes:
      - es_data:/usr/share/elasticsearch/data
      - ../backups/elasticsearch-repository:/usr/share/elasticsearch/snapshots

  etcd:
    image: quay.nju.edu.cn/coreos/etcd:v3.5.5
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    mem_limit: 256m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 15s
      timeout: 5s
      retries: 10
    volumes:
      - etcd_data:/etcd

  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
    command: minio server /minio_data
    mem_limit: 512m
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    volumes:
      - minio_data:/minio_data

  milvus:
    image: milvusdb/milvus:v2.4.0
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    ports:
      - "127.0.0.1:19530:19530"
      - "127.0.0.1:9091:9091"
    mem_limit: 2g
    restart: unless-stopped
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9091/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    volumes:
      - milvus_data:/var/lib/milvus

  # 一次性迁移服务：backend/worker/beat 启动前先执行 alembic upgrade head
  migration:
    build: ../backend
    command: ["python", "-m", "alembic", "upgrade", "head"]
    environment: *backend-env
    restart: "no"
    depends_on:
      mysql:
        condition: service_healthy

  backend:
    build: ../backend
    ports: ["127.0.0.1:8000:8000"]
    environment:
      <<: *backend-env
      IN_PROCESS_SCHEDULER: "false"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mongo:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    restart: unless-stopped
    volumes:
      - upload_data:/data/uploads
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)\""]
      interval: 15s
      timeout: 5s
      retries: 10

  celery-worker:
    build: ../backend
    command: ["python", "-m", "celery", "-A", "celery_worker.celery_app", "worker", "--loglevel=info", "--concurrency=1", "-Q", "maintenance,celery"]
    environment: *backend-env
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mysql:
        condition: service_healthy
      migration:
        condition: service_completed_successfully

  celery-knowledge-worker:
    build: ../backend
    command: ["python", "-m", "celery", "-A", "celery_worker.celery_app", "worker", "--loglevel=info", "--concurrency=1", "-Q", "knowledge"]
    environment: *backend-env
    restart: unless-stopped
    volumes:
      - upload_data:/data/uploads
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mysql:
        condition: service_healthy
      migration:
        condition: service_completed_successfully

  celery-beat:
    build: ../backend
    command: ["python", "-m", "celery", "-A", "celery_worker.celery_app", "beat", "--loglevel=info"]
    environment: *backend-env
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mysql:
        condition: service_healthy
      migration:
        condition: service_completed_successfully

  frontend:
    build: ../frontend
    ports: ["127.0.0.1:5173:80"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  nginx:
    image: nginx:alpine
    ports: ["127.0.0.1:80:80"]
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  # 可观测性（默认关闭；需要时: docker compose --profile observability up -d）
  langfuse-db:
    image: postgres:15-alpine
    profiles: ["observability"]
    environment:
      POSTGRES_USER: ${LANGFUSE_DB_USER:-langfuse}
      POSTGRES_PASSWORD: ${LANGFUSE_DB_PASSWORD:-langfuse}
      POSTGRES_DB: ${LANGFUSE_DB_NAME:-langfuse}
    mem_limit: 256m
    restart: unless-stopped
    volumes:
      - langfuse_db_data:/var/lib/postgresql/data

  clickhouse:
    image: clickhouse/clickhouse-server:24.1
    profiles: ["observability"]
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-langfuse}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-clickhouse}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-clickhouse}
    mem_limit: 512m
    restart: unless-stopped
    volumes:
      - clickhouse_data:/var/lib/clickhouse

  langfuse:
    image: langfuse/langfuse:3
    profiles: ["observability"]
    environment:
      DATABASE_URL: postgresql://${LANGFUSE_DB_USER:-langfuse}:${LANGFUSE_DB_PASSWORD:-langfuse}@langfuse-db:5432/${LANGFUSE_DB_NAME:-langfuse}
      CLICKHOUSE_URL: clickhouse://${CLICKHOUSE_USER:-clickhouse}:${CLICKHOUSE_PASSWORD:-clickhouse}@clickhouse:8123/${CLICKHOUSE_DB:-langfuse}
      CLICKHOUSE_MIGRATION_URL: clickhouse://${CLICKHOUSE_USER:-clickhouse}:${CLICKHOUSE_PASSWORD:-clickhouse}@clickhouse:8123/${CLICKHOUSE_DB:-langfuse}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-clickhouse}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-clickhouse}
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:-langfuse-demo-secret-2026}
      SALT: ${LANGFUSE_SALT:-langfuse-demo-salt-2026}
      NEXTAUTH_URL: ${LANGFUSE_NEXTAUTH_URL:-http://localhost:3000}
      TELEMETRY_ENABLED: "false"
    ports: ["127.0.0.1:3000:3000"]
    mem_limit: 512m
    restart: unless-stopped
    depends_on:
      - langfuse-db
      - clickhouse

volumes:
  upload_data:
  mysql_data:
  mongo_data:
  es_data:
  etcd_data:
  minio_data:
  milvus_data:
  langfuse_db_data:
  clickhouse_data:
